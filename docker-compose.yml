version: "3.8"

services:
  backend:
    image: suoyin-system-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      TOKEN_SECRET: ${TOKEN_SECRET:-gold-recycle-dev-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${API_PORT:-18082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  admin:
    image: suoyin-system-admin:latest
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-14176}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
