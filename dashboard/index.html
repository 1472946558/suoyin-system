<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaw Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a28;--border:#2a2a3a;
  --text:#e8e8f0;--text2:#8888a0;--accent:#6c5ce7;--accent2:#a29bfe;
  --green:#00d68f;--yellow:#ffaa00;--red:#ff4757;--blue:#3498db;
  --radius:12px;
}
html,body{height:100%;font:14px/1.5 -apple-system,BlinkMacSystemFont,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface)}
.header h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.header h1 span{color:var(--accent2)}
.header-right{display:flex;gap:12px;align-items:center}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-size:12px;color:var(--text2)}
.clock{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}

/* Layout */
.main{display:grid;grid-template-columns:280px 1fr;overflow:hidden}

/* Sidebar */
.sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:16px}
.sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:12px;padding:0 12px}
.agent-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background .15s}
.agent-card:hover{background:var(--surface2)}
.agent-card.active{background:var(--surface2);border-left:3px solid var(--accent)}
.agent-emoji{font-size:20px;width:32px;text-align:center;flex-shrink:0}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-role{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-badge{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600;flex-shrink:0}
.badge-active{background:rgba(0,214,143,.15);color:var(--green)}
.badge-standby{background:rgba(255,170,0,.15);color:var(--yellow)}

/* Content */
.content{overflow-y:auto;padding:24px}

/* Stats Row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:28px;font-weight:700}
.stat-sub{font-size:11px;color:var(--text2);margin-top:4px}

/* Sections */
.section{margin-bottom:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:15px;font-weight:700}

/* Task Table */
.task-table{width:100%;border-collapse:separate;border-spacing:0}
.task-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);padding:8px 12px;border-bottom:1px solid var(--border)}
.task-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
.task-table tr:hover td{background:var(--surface)}
.task-id{font-family:monospace;color:var(--text2);font-size:12px}
.task-title{font-weight:600}
.priority-badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700}
.p0{background:rgba(255,71,87,.15);color:var(--red)}
.p1{background:rgba(255,170,0,.15);color:var(--yellow)}
.p2{background:rgba(52,152,219,.15);color:var(--blue)}
.status-badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600}
.s-pending{background:rgba(136,136,160,.15);color:var(--text2)}
.s-in_progress{background:rgba(108,92,231,.15);color:var(--accent2)}
.s-done{background:rgba(0,214,143,.15);color:var(--green)}

/* Agent Detail */
.agent-detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:none}
.agent-detail.show{display:block}
.agent-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.agent-detail-emoji{font-size:40px}
.agent-detail-title{font-size:20px;font-weight:700}
.agent-detail-role{font-size:13px;color:var(--text2)}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.skill-tag{font-size:11px;padding:4px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--accent2)}

/* Project cards */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.project-name{font-weight:700;margin-bottom:8px}
.project-bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:8px 0}
.project-bar-fill{height:100%;border-radius:3px;transition:width .5s}
.project-stats{display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}

/* Log panel */
.log-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:200px;overflow-y:auto}
.log-line{color:var(--text2)}
.log-line .time{color:var(--accent2)}
.log-line .agent{color:var(--green)}
.log-line .action{color:var(--text)}
.log-line .result{color:var(--yellow)}

/* Responsive */
@media(max-width:768px){
  .main{grid-template-columns:1fr}
  .sidebar{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <h1><span>Open</span>Claw Dashboard</h1>
    <div class="header-right">
      <div class="status-dot" id="gw-dot"></div>
      <span class="status-text" id="gw-status">Gateway: checking...</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <h2>Agents</h2>
      <div id="agent-list"></div>
    </aside>

    <main class="content">
      <div class="stats" id="stats-row"></div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Task Board</div>
        </div>
        <table class="task-table">
          <thead><tr><th>ID</th><th>Task</th><th>Agent</th><th>Priority</th><th>Status</th><th>Project</th></tr></thead>
          <tbody id="task-tbody"></tbody>
        </table>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Projects</div>
        </div>
        <div class="projects" id="projects-row"></div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Agent Detail</div>
        </div>
        <div class="agent-detail" id="agent-detail">
          <div class="agent-detail-header">
            <div class="agent-detail-emoji" id="detail-emoji"></div>
            <div>
              <div class="agent-detail-title" id="detail-name"></div>
              <div class="agent-detail-role" id="detail-role"></div>
              <div class="skill-tags" id="detail-skills"></div>
            </div>
          </div>
          <div style="font-size:13px;color:var(--text2)" id="detail-tasks"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Activity Log</div>
        </div>
        <div class="log-panel" id="log-panel"></div>
      </div>
    </main>
  </div>
</div>

<script>
(() => {
  const GW = 'http://localhost:18789';
  const TOKEN = '7b069612a41d2cdde5e035c05288c02f01c62c7b11db217c';

  // ---- Data ----
  let agents = [];
  let tasks = [];
  let projects = [];
  let logs = [];

  function addLog(agent, action, result) {
    const now = new Date().toLocaleTimeString('zh-CN', {hour12:false});
    logs.unshift({time:now, agent, action, result});
    if (logs.length > 50) logs.pop();
    renderLogs();
  }

  // ---- YAML Parser (minimal, for our format) ----
  function parseYAML(text) {
    // Super minimal - just enough for our data files
    const lines = text.split('\n');
    const result = {};
    let currentArray = null;
    let currentObj = null;
    let parentKey = '';
    let depth = 0;

    function getIndent(line) {
      const m = line.match(/^(\s*)/);
      return m ? m[1].length : 0;
    }

    function parseValue(v) {
      v = v.trim();
      if (v === 'null' || v === '~') return null;
      if (v === 'true') return true;
      if (v === 'false') return false;
      if (/^-?\d+$/.test(v)) return parseInt(v);
      if (/^-?\d+\.\d+$/.test(v)) return parseFloat(v);
      if (/^["']/.test(v)) return v.slice(1,-1);
      return v;
    }

    // Use js-yAML if available, otherwise fallback
    return null;
  }

  const API = 'http://localhost:18790';

  // ---- Fetch Data ----
  async function fetchData() {
    // Priority: Scheduler API > Gateway > Embedded defaults
    try {
      const aRes = await fetch(API + '/api/agents', {signal: AbortSignal.timeout(3000)});
      if (aRes.ok) agents = (await aRes.json()).agents || [];
    } catch {}

    if (!agents.length) {
      try {
        const res = await fetch(GW + '/api/agents', {
          headers: {'Authorization': 'Bearer ' + TOKEN},
          signal: AbortSignal.timeout(3000)
        });
        if (res.ok) agents = (await res.json()).agents || [];
      } catch {}
    }

    try {
      const tRes = await fetch(API + '/api/tasks', {signal: AbortSignal.timeout(3000)});
      if (tRes.ok) {
        const td = await tRes.json();
        tasks = td.tasks || [];
        projects = td.projects || [];
      }
    } catch {}

    if (!agents.length) agents = DEFAULT_AGENTS;
    if (!tasks.length) tasks = DEFAULT_TASKS;
    if (!projects.length) projects = DEFAULT_PROJECTS;

    render();
  }

  // ---- Render ----
  function render() {
    renderStats();
    renderAgentList();
    renderTaskTable();
    renderProjects();
  }

  function renderStats() {
    const active = agents.filter(a => a.status === 'active').length;
    const standby = agents.filter(a => a.status === 'standby').length;
    const inProgress = tasks.filter(t => t.status === 'in_progress').length;
    const pending = tasks.filter(t => t.status === 'pending').length;
    const done = tasks.filter(t => t.status === 'done').length;
    const total = tasks.length || 1;

    document.getElementById('stats-row').innerHTML = `
      <div class="stat-card"><div class="stat-label">Active Agents</div><div class="stat-value" style="color:var(--green)">${active}</div><div class="stat-sub">${standby} standby</div></div>
      <div class="stat-card"><div class="stat-label">In Progress</div><div class="stat-value" style="color:var(--accent2)">${inProgress}</div><div class="stat-sub">of ${total} tasks</div></div>
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" style="color:var(--yellow)">${pending}</div><div class="stat-sub">awaiting</div></div>
      <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" style="color:var(--green)">${done}</div><div class="stat-sub">${total ? Math.round(done/total*100) : 0}% success</div></div>
    `;
  }

  function renderAgentList() {
    const el = document.getElementById('agent-list');
    el.innerHTML = agents.map(a => `
      <div class="agent-card" data-id="${a.id}" onclick="window._selectAgent('${a.id}')">
        <div class="agent-emoji">${a.emoji || '🤖'}</div>
        <div class="agent-info">
          <div class="agent-name">${a.name}</div>
          <div class="agent-role">${a.role}</div>
        </div>
        <span class="agent-badge badge-${a.status}">${a.status}</span>
      </div>
    `).join('');
  }

  function renderTaskTable() {
    const tbody = document.getElementById('task-tbody');
    const sorted = [...tasks].sort((a,b) => {
      const po = {P0:0,P1:1,P2:2,P3:3};
      return (po[a.priority]||9) - (po[b.priority]||9);
    });
    tbody.innerHTML = sorted.map(t => `
      <tr>
        <td class="task-id">${t.id}</td>
        <td class="task-title">${t.title}</td>
        <td>${agentEmoji(t.agent)} ${t.agent}</td>
        <td><span class="priority-badge ${t.priority.toLowerCase()}">${t.priority}</span></td>
        <td><span class="status-badge s-${t.status}">${t.status.replace('_',' ')}</span></td>
        <td>${t.project || ''}</td>
      </tr>
    `).join('');
  }

  function renderProjects() {
    const el = document.getElementById('projects-row');
    el.innerHTML = projects.map(p => {
      const done = p.done || 0;
      const total = p.total || 1;
      const pct = Math.round(done/total*100);
      const color = pct > 60 ? 'var(--green)' : pct > 30 ? 'var(--yellow)' : 'var(--red)';
      return `
        <div class="project-card">
          <div class="project-name">${p.name}</div>
          <div class="project-bar"><div class="project-bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="project-stats">
            <span>${done}/${total} done</span><span>${pct}%</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderLogs() {
    const el = document.getElementById('log-panel');
    el.innerHTML = logs.map(l =>
      `<div class="log-line"><span class="time">[${l.time}]</span> <span class="agent">${l.agent}</span> <span class="action">${l.action}</span> <span class="result">${l.result || ''}</span></div>`
    ).join('');
  }

  function agentEmoji(id) {
    const a = agents.find(x => x.id === id);
    return a ? a.emoji : '🤖';
  }

  // ---- Agent Detail ----
  window._selectAgent = function(id) {
    const a = agents.find(x => x.id === id);
    if (!a) return;
    const el = document.getElementById('agent-detail');
    el.classList.add('show');
    document.getElementById('detail-emoji').textContent = a.emoji || '🤖';
    document.getElementById('detail-name').textContent = a.name;
    document.getElementById('detail-role').textContent = a.role;

    const skillsEl = document.getElementById('detail-skills');
    skillsEl.innerHTML = (a.skills || []).map(s =>
      `<span class="skill-tag">${s}</span>`
    ).join('') || '<span style="color:var(--text2)">No skills assigned</span>';

    const agentTasks = tasks.filter(t => t.agent === id);
    document.getElementById('detail-tasks').innerHTML = agentTasks.length
      ? agentTasks.map(t => `<div style="margin:6px 0">• ${t.title} <span class="status-badge s-${t.status}">${t.status.replace('_',' ')}</span></div>`).join('')
      : 'No active tasks';

    // Highlight in sidebar
    document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
    document.querySelector(`.agent-card[data-id="${id}"]`)?.classList.add('active');

    addLog(a.name, 'selected', '');
  };

  // ---- Gateway Check ----
  async function checkGateway() {
    const dot = document.getElementById('gw-dot');
    const txt = document.getElementById('gw-status');
    try {
      const res = await fetch(GW + '/health', {
        headers: {'Authorization': 'Bearer ' + TOKEN},
        signal: AbortSignal.timeout(3000)
      });
      if (res.ok) {
        dot.style.background = 'var(--green)';
        txt.textContent = 'Gateway: online';
        addLog('system', 'gateway health check', 'OK');
      } else throw 0;
    } catch {
      dot.style.background = 'var(--red)';
      txt.textContent = 'Gateway: offline';
      addLog('system', 'gateway health check', 'FAILED');
    }
  }

  // ---- Clock ----
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('zh-CN', {hour12:false}) + ' CST';
  }

  // ---- Defaults (embedded so dashboard works without server) ----
  const DEFAULT_AGENTS = [
    {id:'commander',name:'Commander Agent',role:'总协调，拆任务，分配给其他 Agent',status:'active',emoji:'🎯',skills:[]},
    {id:'strategist',name:'Strategist Agent',role:'优先级排序，Today TOP5',status:'active',emoji:'📊',skills:[]},
    {id:'golf-ios',name:'Golf iOS Agent',role:'iOS Native + Unity + BLE 开发',status:'active',emoji:'⛳',skills:['golf_ios_acceptance','golf_ble_protocol','golf_unity_json_csv']},
    {id:'golf-qa',name:'Golf QA Agent',role:'验收检查，Android 对齐',status:'active',emoji:'✅',skills:['golf_ios_acceptance']},
    {id:'amazon-de',name:'Amazon DE Agent',role:'Amazon.de 德国站运营',status:'active',emoji:'📦',skills:['amazon_product_selection','amazon_ads_optimization','amazon_listing_review','amazon_profit_judgement']},
    {id:'geo-research',name:'GEO Research Agent',role:'GEO/AI 搜索竞品调研',status:'standby',emoji:'🔍',skills:['geo_competitor_analysis']},
    {id:'prompt-engineer',name:'Prompt Engineer Agent',role:'生成 Cursor / Codex Prompt',status:'active',emoji:'✍️',skills:['cursor_prompt_builder']},
    {id:'sop-builder',name:'SOP Builder Agent',role:'沉淀 SOP / Skill / 模板',status:'standby',emoji:'📋',skills:['sop_generator']},
    {id:'memory',name:'Memory Agent',role:'整理长期记忆、归档、日报',status:'active',emoji:'🧠',skills:['meeting_summary']},
    {id:'delivery',name:'Delivery Agent',role:'项目交付和外包管理',status:'active',emoji:'🚀',skills:[]},
    {id:'research',name:'Research Agent',role:'调研、文档验证、工具对比',status:'active',emoji:'🔬',skills:[]},
    {id:'security',name:'Security Agent',role:'安全校验，MCP/Plugin 审核',status:'active',emoji:'🛡️',skills:[]},
    {id:'backup',name:'Backup Agent',role:'备份配置、Agent、Skills',status:'active',emoji:'💾',skills:[]},
    {id:'openclaw',name:'OpenClaw Agent',role:'平台维护，Gateway/MCP 故障排除',status:'active',emoji:'⚙️',skills:['openclaw_skill']},
  ];

  const DEFAULT_TASKS = [
    {id:'T001',title:'修复 Unity CSV/JSON 协议',agent:'golf-ios',project:'Golf iOS',priority:'P0',status:'in_progress'},
    {id:'T002',title:'完成相机模式 UI 对齐',agent:'golf-ios',project:'Golf iOS',priority:'P1',status:'pending'},
    {id:'T003',title:'完成二期合同需求拆解',agent:'golf-ios',project:'Golf iOS',priority:'P1',status:'pending'},
    {id:'T004',title:'609 圆灯差评分析',agent:'amazon-de',project:'Amazon DE',priority:'P1',status:'pending'},
    {id:'T005',title:'德国站选品调研',agent:'amazon-de',project:'Amazon DE',priority:'P2',status:'pending'},
    {id:'T006',title:'补齐系统基础架构',agent:'openclaw',project:'OpenClaw',priority:'P1',status:'in_progress'},
  ];

  const DEFAULT_PROJECTS = [
    {name:'Golf iOS',total:3,done:0,pending:2,in_progress:1},
    {name:'Amazon DE',total:2,done:0,pending:2,in_progress:0},
    {name:'OpenClaw',total:1,done:0,pending:0,in_progress:1},
  ];

  // ---- Init ----
  fetchData();
  checkGateway();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(checkGateway, 30000);
  setInterval(fetchData, 10000);
})();
</script>
</body>
</html>
