<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenClaw 工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08090d;--bg2:#0f1117;--surface:#151720;--surface2:#1c1e2c;--surface3:#232638;
  --border:#2a2d3e;--border2:#363a52;
  --text:#e4e6f0;--text2:#8b8fa8;--text3:#5c6080;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent-bg:rgba(108,92,231,.08);
  --green:#00d68f;--green-bg:rgba(0,214,143,.1);
  --yellow:#ffaa00;--yellow-bg:rgba(255,170,0,.1);
  --red:#ff4757;--red-bg:rgba(255,71,87,.1);
  --blue:#3498db;--blue-bg:rgba(52,152,219,.1);
  --radius:10px;--radius2:14px;
  --shadow:0 2px 8px rgba(0,0,0,.3);
  --transition:all .2s ease;
}
html,body{height:100%;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== Layout ===== */
.app{display:grid;grid-template-rows:48px 1fr;height:100vh;overflow:hidden}

/* Header */
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);z-index:10}
.hd-left{display:flex;align-items:center;gap:14px}
.hd-logo{font-size:16px;font-weight:800;letter-spacing:.5px}.hd-logo b{color:var(--accent2)}
.hd-tabs{display:flex;gap:2px;margin-left:20px}
.hd-tab{padding:6px 14px;font-size:12px;font-weight:500;border-radius:6px;cursor:pointer;color:var(--text2);transition:var(--transition)}
.hd-tab:hover{color:var(--text);background:var(--surface)}
.hd-tab.on{color:var(--accent2);background:var(--accent-bg)}
.hd-right{display:flex;align-items:center;gap:16px;font-size:12px}
.gw-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.gw-on{background:var(--green);box-shadow:0 0 6px var(--green)}
.gw-off{background:var(--red);box-shadow:0 0 6px var(--red)}

/* Body */
.body{display:grid;grid-template-columns:240px 1fr;overflow:hidden}

/* Sidebar */
.side{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:12px 8px}
.side-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);padding:8px 12px 6px;font-weight:700}
.ag{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;transition:var(--transition);margin-bottom:2px}
.ag:hover{background:var(--surface)}
.ag.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent)}
.ag-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.ag-body{flex:1;min-width:0}
.ag-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-role{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-badge{font-size:9px;padding:1px 6px;border-radius:4px;font-weight:700;flex-shrink:0}
.st-active{background:var(--green-bg);color:var(--green)}
.st-standby{background:var(--yellow-bg);color:var(--yellow)}

/* Main */
.main{overflow-y:auto;padding:20px 24px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.st{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;transition:var(--transition)}
.st:hover{border-color:var(--border2);transform:translateY(-1px)}
.st-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:2px;font-weight:600}
.st-val{font-size:26px;font-weight:800;line-height:1.1}
.st-sub{font-size:10px;color:var(--text3);margin-top:2px}

/* Section */
.sec{margin-bottom:20px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:14px;font-weight:700}
.sec-actions{display:flex;gap:6px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:inherit}
.btn:hover{background:var(--surface2);border-color:var(--border2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-sm{padding:3px 8px;font-size:10px;border-radius:4px}
.btn-danger{color:var(--red);border-color:var(--red-bg)}
.btn-danger:hover{background:var(--red-bg)}

/* Table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:10px 12px;background:var(--surface2);font-weight:700;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(108,92,231,.03)}
.t-id{font-family:ui-monospace,monospace;font-size:11px;color:var(--text3)}
.t-title{font-weight:600}
.p0{background:var(--red-bg);color:var(--red);font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;display:inline-block}
.p1{background:var(--yellow-bg);color:var(--yellow);font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;display:inline-block}
.p2{background:var(--blue-bg);color:var(--blue);font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;display:inline-block}
.p3{background:rgba(136,136,160,.1);color:var(--text2);font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700;display:inline-block}
.s-tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;display:inline-block}
.s-pending{background:rgba(136,136,160,.1);color:var(--text2)}
.s-in_progress{background:var(--accent-bg);color:var(--accent2)}
.s-review{background:var(--yellow-bg);color:var(--yellow)}
.s-done{background:var(--green-bg);color:var(--green)}
.s-blocked{background:var(--red-bg);color:var(--red)}

/* Projects */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.proj{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;transition:var(--transition)}
.proj:hover{border-color:var(--border2)}
.proj-name{font-weight:700;font-size:13px;margin-bottom:8px}
.proj-bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin:6px 0}
.proj-fill{height:100%;border-radius:3px;transition:width .6s ease}
.proj-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--text3)}

/* Agent Detail */
.detail{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;display:none}
.detail.show{display:block}
.det-hd{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.det-icon{font-size:36px}
.det-info{flex:1}
.det-name{font-size:18px;font-weight:800}
.det-role{font-size:12px;color:var(--text2);margin-top:2px}
.det-skills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sk-tag{font-size:10px;padding:3px 8px;border-radius:5px;background:var(--surface3);border:1px solid var(--border);color:var(--accent2)}
.det-tasks{margin-top:12px}
.det-task{padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.det-task:last-child{border-bottom:none}
.det-task-title{font-size:12px;font-weight:500}
.det-task-actions{display:flex;gap:4px}

/* Log */
.logs{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:12px;font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:180px;overflow-y:auto}
.log-l{color:var(--text2)}.log-l .lt{color:var(--text3)}.log-l .la{color:var(--accent2)}.log-l .lr{color:var(--yellow)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;place-items:center}
.modal-bg.show{display:grid}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:24px;width:min(480px,90%);max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:var(--transition)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg textarea{min-height:60px;resize:vertical}
.fg select{appearance:none;cursor:pointer}
.fg select option{background:var(--surface);color:var(--text)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Toast */
.toast-wrap{position:fixed;top:56px;right:20px;z-index:200;display:flex;flex-direction:column;gap:6px}
.toast{padding:10px 16px;border-radius:var(--radius);font-size:12px;font-weight:500;animation:slideIn .3s ease;box-shadow:var(--shadow)}
.toast-ok{background:var(--green-bg);border:1px solid var(--green);color:var(--green)}
.toast-err{background:var(--red-bg);border:1px solid var(--red);color:var(--red)}
.toast-info{background:var(--blue-bg);border:1px solid var(--blue);color:var(--blue)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* Responsive */
@media(max-width:900px){.body{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-left">
      <div class="hd-logo"><b>Open</b>Claw 工作台</div>
      <div class="hd-tabs">
        <div class="hd-tab on" data-tab="overview">总览</div>
        <div class="hd-tab" data-tab="agents">Agent</div>
        <div class="hd-tab" data-tab="tasks">任务</div>
        <div class="hd-tab" data-tab="messages">沟通</div>
        <div class="hd-tab" data-tab="projects">项目</div>
        <div class="hd-tab" data-tab="logs">日志</div>
      </div>
    </div>
    <div class="hd-right">
      <span><span class="gw-dot gw-off" id="gw-dot"></span> <span id="gw-txt">网关检测中...</span></span>
      <span>调度器 <span id="sch-txt" style="color:var(--red)">离线</span></span>
      <span id="clock" style="font-variant-numeric:tabular-nums;color:var(--text3)"></span>
    </div>
  </header>

  <div class="body">
    <aside class="side" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
</div>

<!-- 新建任务弹窗 -->
<div class="modal-bg" id="modal-new-task">
  <div class="modal">
    <h3>新建任务</h3>
    <div class="fg"><label>标题</label><input id="nt-title" placeholder="输入任务标题"></div>
    <div class="fg"><label>分配 Agent</label><select id="nt-agent"></select></div>
    <div class="fg"><label>所属项目</label><select id="nt-project"><option>Golf iOS</option><option>Amazon DE</option><option>OpenClaw</option><option>Candy</option><option>GEO</option></select></div>
    <div class="fg"><label>优先级</label><select id="nt-priority"><option value="P0">P0 紧急</option><option value="P1">P1 高</option><option value="P2" selected>P2 中</option><option value="P3">P3 低</option></select></div>
    <div class="fg"><label>描述</label><textarea id="nt-desc" placeholder="任务描述（可选）"></textarea></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitNewTask()">创建</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
const API = 'http://localhost:18790';
const GW = 'http://localhost:18789';

let S = { agents:[], tasks:[], projects:[], logs:[], messages:[], tab:'overview', selAgent:null };

// ===== API =====
async function api(path, opts) {
  try { const r = await fetch(API + path, opts); return await r.json(); }
  catch(e) { return null; }
}

// ===== 数据加载 =====
async function reload() {
  const d = await api('/api/tasks');
  if (d) { S.tasks = d.tasks||[]; S.projects = d.projects||[]; }
  const a = await api('/api/agents');
  if (a) S.agents = a.agents||[];
  const l = await api('/api/logs');
  if (l) S.logs = (l.logs||[]).reverse();
  const m = await api('/api/messages');
  if (m) S.messages = (m.messages||[]).reverse();
  render();
}

// ===== 网关检测 =====
async function checkGW() {
  try {
    const r = await fetch(GW + '/', {signal: AbortSignal.timeout(3000)});
    const dot = document.getElementById('gw-dot');
    const txt = document.getElementById('gw-txt');
    if (r.ok) { dot.className='gw-dot gw-on'; txt.textContent='网关在线'; txt.style.color='var(--green)'; }
    else throw 0;
  } catch {
    document.getElementById('gw-dot').className='gw-dot gw-off';
    document.getElementById('gw-txt').textContent='网关离线';
    document.getElementById('gw-txt').style.color='var(--red)';
  }
}

async function checkScheduler() {
  try {
    const r = await fetch(API + '/health', {signal: AbortSignal.timeout(2000)});
    if (r && r.ok) { document.getElementById('sch-txt').textContent='在线'; document.getElementById('sch-txt').style.color='var(--green)'; }
    else throw 0;
  } catch {
    document.getElementById('sch-txt').textContent='离线';
    document.getElementById('sch-txt').style.color='var(--red)';
  }
}

// ===== Tab 切换 =====
document.querySelectorAll('.hd-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.hd-tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    S.tab = t.dataset.tab;
    render();
  };
});

// ===== 渲染 =====
function render() {
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  const activeCount = S.agents.filter(a => a.status === 'active').length;
  el.innerHTML = `<div class="side-title">Agent 团队 (${activeCount}/${S.agents.length})</div>` +
    S.agents.map(a => {
      const tasks = S.tasks.filter(t => t.agent === a.id && t.status !== 'done');
      const cls = S.selAgent === a.id ? ' on' : '';
      return `<div class="ag${cls}" onclick="selectAgent('${a.id}')">
        <div class="ag-icon">${a.emoji||'🤖'}</div>
        <div class="ag-body">
          <div class="ag-name">${a.name}</div>
          <div class="ag-role">${a.role}${tasks.length ? ` · ${tasks.length}任务` : ''}</div>
        </div>
        <span class="ag-badge st-${a.status}">${a.status==='active'?'活跃':'待命'}</span>
      </div>`;
    }).join('');
}

function renderMain() {
  const m = document.getElementById('main');
  switch(S.tab) {
    case 'overview': m.innerHTML = renderOverview(); break;
    case 'agents': m.innerHTML = renderAgentPage(); break;
    case 'tasks': m.innerHTML = renderTaskPage(); break;
    case 'messages': m.innerHTML = renderMessagePage(); break;
    case 'projects': m.innerHTML = renderProjectPage(); break;
    case 'logs': m.innerHTML = renderLogPage(); break;
  }
}

// ----- 总览 -----
function renderOverview() {
  const active = S.agents.filter(a=>a.status==='active').length;
  const ip = S.tasks.filter(t=>t.status==='in_progress').length;
  const pending = S.tasks.filter(t=>t.status==='pending').length;
  const done = S.tasks.filter(t=>t.status==='done').length;
  const total = S.tasks.length||1;

  return `
  <div class="stats">
    <div class="st"><div class="st-label">活跃 Agent</div><div class="st-val" style="color:var(--green)">${active}</div><div class="st-sub">共 ${S.agents.length} 个</div></div>
    <div class="st"><div class="st-label">进行中</div><div class="st-val" style="color:var(--accent2)">${ip}</div><div class="st-sub">共 ${total} 个任务</div></div>
    <div class="st"><div class="st-label">待处理</div><div class="st-val" style="color:var(--yellow)">${pending}</div><div class="st-sub">等待分配</div></div>
    <div class="st"><div class="st-label">已完成</div><div class="st-val" style="color:var(--green)">${done}</div><div class="st-sub">完成率 ${Math.round(done/total*100)}%</div></div>
  </div>
  ${renderProjectCards()}
  <div class="sec">
    <div class="sec-hd"><div class="sec-title">当前进行中的任务</div></div>
    <table class="tbl"><thead><tr><th>编号</th><th>任务</th><th>Agent</th><th>优先级</th><th>项目</th><th>操作</th></tr></thead>
    <tbody>${S.tasks.filter(t=>t.status==='in_progress').map(t=>`<tr>
      <td class="t-id">${t.id}</td><td class="t-title">${t.title}</td>
      <td>${agentEmoji(t.agent)} ${agentName(t.agent)}</td>
      <td><span class="${t.priority.toLowerCase()}">${t.priority}</span></td>
      <td>${t.project}</td>
      <td><button class="btn btn-sm" onclick="taskAction('${t.id}','done')">完成</button>
          <button class="btn btn-sm btn-danger" onclick="taskAction('${t.id}','blocked')">阻塞</button></td>
    </tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--text3);padding:20px">暂无进行中的任务</td></tr>'}</tbody></table>
  </div>
  ${renderRecentLogs()}`;
}

// ----- Agent 页 -----
function renderAgentPage() {
  if (S.selAgent) return renderAgentDetail();
  return `<div class="sec"><div class="sec-hd"><div class="sec-title">Agent 团队</div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">
  ${S.agents.map(a => {
    const tasks = S.tasks.filter(t=>t.agent===a.id);
    const active = tasks.filter(t=>t.status==='in_progress').length;
    const done = tasks.filter(t=>t.status==='done').length;
    return `<div class="proj" style="cursor:pointer" onclick="selectAgent('${a.id}')">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="font-size:24px">${a.emoji||'🤖'}</span>
        <div><div style="font-weight:700;font-size:13px">${a.name}</div><div style="font-size:11px;color:var(--text3)">${a.role}</div></div>
        <span class="ag-badge st-${a.status}" style="margin-left:auto">${a.status==='active'?'活跃':'待命'}</span>
      </div>
      ${(a.skills||[]).length ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px">${a.skills.map(s=>`<span class="sk-tag">${s}</span>`).join('')}</div>` : ''}
      <div style="font-size:10px;color:var(--text3)">${tasks.length} 任务 · ${active} 进行中 · ${done} 已完成</div>
    </div>`;
  }).join('')}</div></div>`;
}

function renderAgentDetail() {
  const a = S.agents.find(x=>x.id===S.selAgent);
  if (!a) return '';
  const tasks = S.tasks.filter(t=>t.agent===a.id);
  return `<div class="detail show">
    <div class="det-hd"><div class="det-icon">${a.emoji}</div>
      <div class="det-info"><div class="det-name">${a.name}</div><div class="det-role">${a.role}</div>
        ${(a.skills||[]).length ? `<div class="det-skills">${a.skills.map(s=>`<span class="sk-tag">${s}</span>`).join('')}</div>` : ''}
      </div>
      <button class="btn" onclick="S.selAgent=null;render()">返回列表</button>
    </div>
    <div class="det-tasks"><div style="font-weight:700;margin-bottom:8px">任务 (${tasks.length})</div>
    ${tasks.length ? tasks.map(t => `<div class="det-task">
      <div><span class="t-id">${t.id}</span> <span class="det-task-title">${t.title}</span>
        <span class="${t.priority.toLowerCase()}" style="margin-left:6px">${t.priority}</span>
        <span class="s-tag s-${t.status}" style="margin-left:4px">${statusLabel(t.status)}</span></div>
      <div class="det-task-actions">
        ${t.status==='pending'?`<button class="btn btn-sm btn-primary" onclick="taskAction('${t.id}','in_progress')">开始</button>`:''}
        ${t.status==='in_progress'?`<button class="btn btn-sm" onclick="taskAction('${t.id}','review')">提交验收</button>
          <button class="btn btn-sm" onclick="taskAction('${t.id}','done')">完成</button>`:''}
        ${t.status==='review'?`<button class="btn btn-sm btn-primary" onclick="taskAction('${t.id}','done')">验收通过</button>
          <button class="btn btn-sm btn-danger" onclick="taskAction('${t.id}','in_progress')">打回</button>`:''}
        ${t.status!=='done'?`<button class="btn btn-sm btn-danger" onclick="taskAction('${t.id}','blocked')">阻塞</button>`:''}
      </div>
    </div>`).join('') : '<div style="color:var(--text3);padding:8px 0">暂无任务</div>'}</div>
  </div>`;
}

// ----- 任务页 -----
function renderTaskPage() {
  const sorted = [...S.tasks].sort((a,b)=>({P0:0,P1:1,P2:2,P3:3}[a.priority]||9)-({P0:0,P1:1,P2:2,P3:3}[b.priority]||9));
  return `<div class="sec">
    <div class="sec-hd">
      <div class="sec-title">全部任务 (${S.tasks.length})</div>
      <div class="sec-actions">
        <button class="btn btn-primary" onclick="openNewTask()">+ 新建任务</button>
        <button class="btn" onclick="triggerSchedule()">手动调度</button>
      </div>
    </div>
    <table class="tbl"><thead><tr><th>编号</th><th>任务</th><th>Agent</th><th>优先级</th><th>状态</th><th>项目</th><th>操作</th></tr></thead>
    <tbody>${sorted.map(t=>`<tr>
      <td class="t-id">${t.id}</td><td class="t-title">${t.title}</td>
      <td>${agentEmoji(t.agent)} ${agentName(t.agent)}</td>
      <td><span class="${t.priority.toLowerCase()}">${t.priority}</span></td>
      <td><span class="s-tag s-${t.status}">${statusLabel(t.status)}</span></td>
      <td>${t.project}</td>
      <td>
        ${t.status==='pending'?`<button class="btn btn-sm btn-primary" onclick="taskAction('${t.id}','in_progress')">开始</button>`:''}
        ${t.status==='in_progress'?`<button class="btn btn-sm" onclick="taskAction('${t.id}','done')">完成</button>`:''}
        ${t.status!=='done'?`<button class="btn btn-sm btn-danger" onclick="deleteTask('${t.id}')">删除</button>`:''}
      </td>
    </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:20px">暂无任务</td></tr>'}</tbody></table>
  </div>`;
}

// ----- 项目页 -----
function renderProjectPage() {
  return `<div class="sec"><div class="sec-hd"><div class="sec-title">项目进度</div></div>
  <div class="projs">${(S.projects.length ? S.projects : [
    {name:'Golf iOS',total:3,done:0,in_progress:1,pending:2},
    {name:'Amazon DE',total:2,done:0,in_progress:0,pending:2},
    {name:'OpenClaw',total:1,done:0,in_progress:1,pending:0},
  ]).map(p => {
    const total = p.total||1;
    const pct = Math.round((p.done||0)/total*100);
    const color = pct>60?'var(--green)':pct>30?'var(--yellow)':'var(--accent2)';
    return `<div class="proj">
      <div class="proj-name">${p.name}</div>
      <div class="proj-bar"><div class="proj-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="proj-meta"><span>完成 ${p.done||0}/${total}</span><span style="color:${color}">${pct}%</span></div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">进行中 ${p.in_progress||0} · 待处理 ${p.pending||0}</div>
    </div>`;
  }).join('')}</div></div>`;
}

// ----- 沟通页 -----
function renderMessagePage() {
  return `<div class="sec">
    <div class="sec-hd"><div class="sec-title">项目沟通</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div>
        <div style="font-weight:700;margin-bottom:8px;font-size:13px">粘贴微信聊天内容</div>
        <textarea id="msg-input" style="width:100%;min-height:200px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:inherit;resize:vertical;outline:none" placeholder="把微信聊天记录粘贴到这里...&#10;&#10;系统会自动提取：&#10;· 截止日期&#10;· 需求点&#10;· 关键决策"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <div class="fg" style="flex:1;margin:0"><label style="font-size:10px">联系人</label><input id="msg-contact" placeholder="客户名称" style="padding:6px 8px;font-size:12px"></div>
          <div class="fg" style="flex:1;margin:0"><label style="font-size:10px">项目</label><select id="msg-project" style="padding:6px 8px;font-size:12px"><option value="">未指定</option><option>Golf iOS</option><option>Amazon DE</option><option>OpenClaw</option><option>Candy</option><option>GEO</option></select></div>
          <button class="btn btn-primary" style="align-self:flex-end" onclick="submitMessage()">解析并保存</button>
        </div>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:8px;font-size:13px">最近沟通 <span style="color:var(--text3);font-weight:400">(${S.messages.length})</span></div>
        <div style="max-height:320px;overflow-y:auto">
        ${S.messages.map(m => `<div class="proj" style="margin-bottom:8px;padding:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-weight:700;font-size:12px">${m.contact || '未知联系人'} <span style="color:var(--text3);font-weight:400;font-size:10px">${m.project ? '· '+m.project : ''}</span></div>
            <span style="font-size:10px;color:var(--text3)">${(m.time||'').slice(0,16).replace('T',' ')}</span>
          </div>
          <div style="font-size:11px;color:var(--text2);max-height:60px;overflow:hidden;margin-bottom:6px;white-space:pre-wrap">${escHtml((m.raw||'').slice(0,200))}</div>
          ${m.keywords.deadline.length ? `<div style="margin-bottom:4px"><span style="font-size:10px;color:var(--yellow)">截止:</span> ${m.keywords.deadline.map(d=>`<span class="s-tag s-review" style="font-size:9px">${d}</span>`).join(' ')}</div>` : ''}
          ${m.keywords.requirements.length ? `<div style="margin-bottom:4px"><span style="font-size:10px;color:var(--accent2)">需求:</span> ${m.keywords.requirements.length} 条</div>` : ''}
          ${m.keywords.decisions.length ? `<div><span style="font-size:10px;color:var(--green)">决策:</span> ${m.keywords.decisions.length} 条</div>` : ''}
        </div>`).join('') || '<div style="color:var(--text3);text-align:center;padding:40px">暂无沟通记录<br><br>粘贴微信聊天内容到左侧输入框</div>'}
        </div>
      </div>
    </div>
  </div>`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function submitMessage() {
  const raw = document.getElementById('msg-input').value.trim();
  if (!raw) { toast('请粘贴聊天内容','err'); return; }
  const body = {
    raw,
    contact: document.getElementById('msg-contact').value.trim(),
    project: document.getElementById('msg-project').value,
  };
  const r = await api('/api/messages', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if (r) {
    toast(`已解析：${r.keywords.requirements.length} 个需求，${r.keywords.deadline.length} 个截止日期`,'ok');
    document.getElementById('msg-input').value = '';
    document.getElementById('msg-contact').value = '';
    reload();
  } else toast('解析失败','err');
}

// ----- 日志页 -----
function renderLogPage() {
  return `<div class="sec"><div class="sec-hd"><div class="sec-title">系统日志</div>
    <button class="btn" onclick="reload()">刷新</button></div>
    <div class="logs">${S.logs.length ? S.logs.map(l =>
      `<div class="log-l"><span class="lt">[${l.time?.slice(11,19)||''}]</span> <span class="la">[${l.source}]</span> ${l.message}</div>`
    ).join('') : '<div style="color:var(--text3)">暂无日志</div>'}</div></div>`;
}

// ----- 共用组件 -----
function renderProjectCards() {
  return `<div class="sec"><div class="sec-hd"><div class="sec-title">项目进度</div></div>
  <div class="projs">${(S.projects.length?S.projects:[]).map(p=>{
    const t=p.total||1;const pct=Math.round((p.done||0)/t*100);
    const c=pct>60?'var(--green)':pct>30?'var(--yellow)':'var(--accent2)';
    return `<div class="proj"><div class="proj-name">${p.name}</div><div class="proj-bar"><div class="proj-fill" style="width:${pct}%;background:${c}"></div></div><div class="proj-meta"><span>${p.done||0}/${t} 完成</span><span style="color:${c}">${pct}%</span></div></div>`;
  }).join('')}</div></div>`;
}

function renderRecentLogs() {
  const recent = S.logs.slice(0,8);
  if (!recent.length) return '';
  return `<div class="sec"><div class="sec-hd"><div class="sec-title">最近日志</div></div>
  <div class="logs">${recent.map(l=>`<div class="log-l"><span class="lt">[${l.time?.slice(11,19)||''}]</span> <span class="la">[${l.source}]</span> ${l.message}</div>`).join('')}</div></div>`;
}

// ===== 辅助 =====
function agentName(id) { return (S.agents.find(a=>a.id===id)||{}).name||id; }
function agentEmoji(id) { return (S.agents.find(a=>a.id===id)||{}).emoji||'🤖'; }
function statusLabel(s) { return {pending:'待处理',in_progress:'进行中',review:'验收中',done:'已完成',blocked:'已阻塞'}[s]||s; }

// ===== 操作 =====
async function taskAction(id, status) {
  const r = await api(`/api/tasks/${id}`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
  if (r) { toast(`任务 ${id} 已标记为 ${statusLabel(status)}`,'ok'); reload(); }
  else toast('操作失败','err');
}

async function deleteTask(id) {
  if (!confirm(`确定删除任务 ${id}?`)) return;
  // Mark as removed by updating status
  const r = await api(`/api/tasks/${id}`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'deleted'})});
  if (r) { toast(`任务 ${id} 已删除`,'ok'); reload(); }
  else toast('删除失败','err');
}

async function triggerSchedule() {
  const r = await api('/api/schedule', {method:'POST'});
  if (r) { toast('调度完成','ok'); reload(); }
  else toast('调度失败','err');
}

function selectAgent(id) {
  S.selAgent = id;
  S.tab = 'agents';
  document.querySelectorAll('.hd-tab').forEach(t => {
    t.classList.toggle('on', t.dataset.tab === 'agents');
  });
  render();
}

// ===== 新建任务 =====
function openNewTask() {
  const sel = document.getElementById('nt-agent');
  sel.innerHTML = S.agents.map(a=>`<option value="${a.id}">${a.emoji} ${a.name}</option>`).join('');
  document.getElementById('modal-new-task').classList.add('show');
}

function closeModal() { document.getElementById('modal-new-task').classList.remove('show'); }

async function submitNewTask() {
  const title = document.getElementById('nt-title').value.trim();
  if (!title) { toast('请输入任务标题','err'); return; }
  const body = {
    title,
    agent: document.getElementById('nt-agent').value,
    project: document.getElementById('nt-project').value,
    priority: document.getElementById('nt-priority').value,
    description: document.getElementById('nt-desc').value.trim(),
  };
  const r = await api('/api/tasks', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if (r) { toast(`任务 ${r.id} 已创建`,'ok'); closeModal(); reload(); }
  else toast('创建失败','err');
}

// ===== Toast =====
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

// ===== Clock =====
function tick() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN',{hour12:false});
}

// ===== Init =====
async function init() {
  tick(); setInterval(tick, 1000);
  await reload();
  await checkGW(); setInterval(checkGW, 30000);
  await checkScheduler(); setInterval(checkScheduler, 15000);
  setInterval(reload, 5000);
}
init();
</script>
</body>
</html>
